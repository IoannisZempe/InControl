<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep Obsidian Squircle Background -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16151D"/>
      <stop offset="50%" stop-color="#0B0B10"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>

    <!-- Ambient Forged Gold Radial Glow -->
    <radialGradient id="coreGlow" cx="256" cy="240" r="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8C468" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Forged One Ring Gold Gradient -->
    <linearGradient id="ringGold" x1="112" y1="72" x2="400" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF6D6"/>
      <stop offset="48%" stop-color="#E8C468"/>
      <stop offset="100%" stop-color="#B88628"/>
    </linearGradient>
  </defs>

  <!-- Apple Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#coreGlow)"/>
  <rect x="27" y="27" width="458" height="458" rx="109" stroke="#E8C468" stroke-opacity="0.32" stroke-width="6"/>

  <!-- Forged One Ring Outer Band -->
  <circle cx="256" cy="256" r="164" stroke="url(#ringGold)" stroke-width="28" stroke-opacity="0.94"/>

  <!-- Inner Inscription / Rune Ring -->
  <circle cx="256" cy="256" r="128" stroke="#FFF6D6" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="12 20"/>

  <!-- Inner Flame Contour -->
  <path d="M256 132 C296 184 300 328 256 380 C212 328 216 184 256 132 Z" fill="url(#ringGold)" fill-opacity="0.28"/>

  <!-- All-Seeing Eye Vertical Golden Iris & Obsidian Pupil Slit -->
  <ellipse cx="256" cy="256" rx="16.8" ry="88" fill="url(#ringGold)"/>
  <ellipse cx="256" cy="256" rx="7.2" ry="56" fill="#070709"/>
</svg>
