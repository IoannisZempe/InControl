<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="InControl Architecture — Local Agents to Hub :4747 to Mac, Phone, WhatsApp, and Railway Postgres">
  <defs>
    <style>
      .bg { fill: #070709; }
      .card { fill: #0c0c0f; stroke: #24242a; stroke-width: 1; }
      .hub { fill: #111116; stroke: #e8c468; stroke-width: 1.5; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .gold { fill: #e8c468; }
      .white { fill: #f5f5f7; }
      .muted { fill: #8b8b96; }
      .flow-right { stroke-dasharray: 5 5; animation: dashRight 1.4s linear infinite; }
      .flow-left { stroke-dasharray: 5 5; animation: dashLeft 1.4s linear infinite; }
      @keyframes dashRight {
        to { stroke-dashoffset: -20; }
      }
      @keyframes dashLeft {
        to { stroke-dashoffset: 20; }
      }
    </style>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1d1d23" />
    </pattern>
  </defs>

  <rect width="1200" height="350" rx="12" class="bg" />
  <rect width="1200" height="350" rx="12" fill="url(#dots)" />
  <rect width="1200" height="350" rx="12" fill="none" stroke="#222228" stroke-width="1.5" />

  <!-- Header -->
  <text x="28" y="34" class="mono gold" font-size="11" font-weight="700" letter-spacing="1.2">
    ARCHITECTURE // ZERO-CLOUD RUNTIME + OPTIONAL CLOUD ARCHIVE
  </text>

  <!-- LEFT COLUMN: AGENTS / SOURCES -->
  <g transform="translate(28, 56)">
    <rect width="300" height="58" rx="6" class="card" />
    <circle cx="20" cy="22" r="4" fill="#ef4444" />
    <text x="34" y="26" class="mono white" font-size="12" font-weight="700">CLAUDE CODE HOOKS</text>
    <text x="34" y="44" class="mono muted" font-size="10.5">PreToolUse · Notification · Stop</text>

    <rect y="70" width="300" height="58" rx="6" class="card" />
    <circle cx="20" cy="92" r="4" fill="#e8c468" />
    <text x="34" y="96" class="mono white" font-size="12" font-weight="700">ANTIGRAVITY + CURSOR MCP</text>
    <text x="34" y="114" class="mono muted" font-size="10.5">hooks.json + stdio MCP + handoff</text>

    <rect y="140" width="300" height="58" rx="6" class="card" />
    <circle cx="20" cy="162" r="4" fill="#22c55e" />
    <text x="34" y="166" class="mono white" font-size="12" font-weight="700">CODEX + CHATGPT.APP</text>
    <text x="34" y="184" class="mono muted" font-size="10.5">auto-watcher + codex queue --thread</text>

    <rect y="210" width="300" height="58" rx="6" class="card" />
    <circle cx="20" cy="232" r="4" fill="#8b8b96" />
    <text x="34" y="236" class="mono white" font-size="12" font-weight="700">CUSTOM AGENTS &amp; CLI</text>
    <text x="34" y="254" class="mono muted" font-size="10.5">incontrol wrap · JS/Python SDK</text>
  </g>

  <!-- ANIMATED CONNECTORS: SOURCES -> HUB -->
  <g fill="none" stroke="#e8c468" stroke-width="1.5" opacity="0.85">
    <path d="M 328 85 C 378 85, 372 175, 422 175" class="flow-right" />
    <path d="M 328 155 C 375 155, 375 182, 422 182" class="flow-right" />
    <path d="M 328 225 C 375 225, 375 198, 422 198" class="flow-right" />
    <path d="M 328 295 C 378 295, 372 205, 422 205" class="flow-right" />
  </g>
  <text x="375" y="138" text-anchor="middle" class="mono gold" font-size="9.5">HTTP</text>
  <text x="375" y="252" text-anchor="middle" class="mono gold" font-size="9.5">INBOX</text>

  <!-- CENTER: INCONTROL HUB :4747 -->
  <g transform="translate(422, 74)">
    <rect width="340" height="232" rx="10" class="hub" />
    <text x="170" y="34" text-anchor="middle" class="mono gold" font-size="11" font-weight="700" letter-spacing="1.2">
      LOCAL-FIRST ENGINE
    </text>
    <text x="170" y="64" text-anchor="middle" class="sans white" font-size="22" font-weight="800">
      TheOne Hub :4747
    </text>
    <line x1="28" y1="82" x2="312" y2="82" stroke="#2a2a32" />

    <g transform="translate(28, 104)" class="mono" font-size="11">
      <text x="0" y="0" class="white">● Triage &amp; blocking /ask queue</text>
      <text x="0" y="24" class="white">● 192-bit QR auth + Host guard</text>
      <text x="0" y="48" class="white">● Secret redaction before sync</text>
      <text x="0" y="72" class="gold">● 15m auto-save + rollover ledger</text>
      <text x="0" y="96" class="muted">~/.incontrol/history/YYYY-MM-DD</text>
    </g>
  </g>

  <!-- ANIMATED CONNECTORS: HUB -> SURFACES -->
  <g fill="none" stroke="#f5f5f7" stroke-width="1.5" opacity="0.7">
    <path d="M 762 175 C 812 175, 806 85, 856 85" class="flow-right" />
    <path d="M 762 182 C 809 182, 809 155, 856 155" class="flow-right" />
    <path d="M 762 198 C 809 198, 809 225, 856 225" stroke="#22c55e" class="flow-right" />
    <path d="M 762 205 C 812 205, 806 295, 856 295" stroke="#e8c468" class="flow-right" />
  </g>
  <text x="809" y="138" text-anchor="middle" class="mono muted" font-size="9.5">WS</text>
  <text x="809" y="252" text-anchor="middle" class="mono gold" font-size="9.5">SYNC</text>

  <!-- RIGHT COLUMN: SURFACES & ARCHIVE -->
  <g transform="translate(856, 56)">
    <rect width="316" height="58" rx="6" class="card" />
    <text x="20" y="26" class="mono white" font-size="12" font-weight="700">MACOS LIQUID GLASS PANEL</text>
    <text x="20" y="44" class="mono muted" font-size="10.5">Floating NSPanel · Focus IDE ↗</text>

    <rect y="70" width="316" height="58" rx="6" class="card" />
    <text x="20" y="96" class="mono white" font-size="12" font-weight="700">PHONE / BROWSER / HOMEVIEW</text>
    <text x="20" y="114" class="mono muted" font-size="10.5">1-scan QR · LAN / Tailscale PWA</text>

    <rect y="140" width="316" height="58" rx="6" class="card" />
    <text x="20" y="166" class="mono" fill="#4ade80" font-size="12" font-weight="700">WHATSAPP AUTO-ESCALATION</text>
    <text x="20" y="184" class="mono muted" font-size="10.5">2-way reply &amp; urgent mobile link</text>

    <rect y="210" width="316" height="58" rx="6" class="card" />
    <text x="20" y="236" class="mono gold" font-size="12" font-weight="700">RAILWAY POSTGRES + MCP BRIEF</text>
    <text x="20" y="254" class="mono muted" font-size="10.5">By-day JSONB · cross-IDE handoff</text>
  </g>
</svg>
